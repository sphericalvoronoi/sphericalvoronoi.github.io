<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Video Comparison with Reset</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 40px 0;
        }

        .carousel-container {
            width: 900px;
            max-width: 95vw;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .thumbs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .thumb {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #555;
            cursor: pointer;
            font-size: 0.9rem;
            background: #222;
            color: #ccc;
            user-select: none;
        }

        .thumb.active {
            background: #0d6efd;
            border-color: #0d6efd;
            color: #fff;
        }

        .comparison-wrapper {
            position: relative;
            width: 100%;
            height: 400px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            cursor: ew-resize;
        }

        .comparison {
            position: absolute;
            inset: 0;
            display: none;
        }

        .comparison.active {
            display: block;
        }

        .image-container {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .image-before {
            z-index: 2;
            clip-path: inset(0 50% 0 0);
        }

        .image-after {
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .divider {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 3px;
            background: #fff;
            z-index: 3;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
        }

        .labels-container {
            position: absolute;
            top: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 4;
            font-size: 0.85rem;
            font-weight: 600;
            text-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
        }

        .label {
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.6);
        }

        .controls {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 4;
            display: flex;
            gap: 8px;
        }

        .control-btn {
            border: none;
            border-radius: 999px;
            padding: 6px 14px;
            font-size: 0.9rem;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .hint {
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <div class="carousel-container">
        <h1>Video Comparison with Reset</h1>
        <div class="thumbs">
            <div class="thumb active">Ours vs GT</div>
            <div class="thumb">Ours vs Ref-GS</div>
            <div class="thumb">Ours vs 3DGS-DR</div>
        </div>

        <div class="comparison-wrapper">
            <!-- 1) Ours vs GT -->
            <div class="comparison active" data-type="video">
                <div class="image-container image-after">
                    <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" autoplay loop
                        muted playsinline></video>
                </div>
                <div class="image-container image-before">
                    <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" autoplay loop
                        muted playsinline></video>
                </div>
                <div class="divider"></div>
                <div class="labels-container">
                    <div class="label label-left">Ours</div>
                    <div class="label label-right">GT</div>
                </div>
                <div class="controls">
                    <button class="control-btn play-btn"><span>⏸</span><span>Pause</span></button>
                    <button class="control-btn reset-btn">🔄 Reset</button>
                </div>
            </div>

            <!-- 2) Ours vs Ref-GS -->
            <div class="comparison" data-type="video">
                <div class="image-container image-after">
                    <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" autoplay loop
                        muted playsinline></video>
                </div>
                <div class="image-container image-before">
                    <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" autoplay loop
                        muted playsinline></video>
                </div>
                <div class="divider"></div>
                <div class="labels-container">
                    <div class="label label-left">Ours</div>
                    <div class="label label-right">Ref-GS</div>
                </div>
                <div class="controls">
                    <button class="control-btn play-btn"><span>⏸</span><span>Pause</span></button>
                    <button class="control-btn reset-btn">🔄 Reset</button>
                </div>
            </div>

            <!-- 3) Ours vs 3DGS-DR -->
            <div class="comparison" data-type="video">
                <div class="image-container image-after">
                    <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" autoplay loop
                        muted playsinline></video>
                </div>
                <div class="image-container image-before">
                    <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" autoplay loop
                        muted playsinline></video>
                </div>
                <div class="divider"></div>
                <div class="labels-container">
                    <div class="label label-left">Ours</div>
                    <div class="label label-right">3DGS-DR</div>
                </div>
                <div class="controls">
                    <button class="control-btn play-btn"><span>⏸</span><span>Pause</span></button>
                    <button class="control-btn reset-btn">🔄 Reset</button>
                </div>
            </div>
        </div>

        <p class="hint">Trascina il mouse per spostare lo slider.</p>
    </div>

    <script>
        document.querySelectorAll('.carousel-container').forEach(container => {
            const thumbs = container.querySelectorAll('.thumb');
            const wrapper = container.querySelector('.comparison-wrapper');
            const comparisons = container.querySelectorAll('.comparison');
            let currentIndex = 0;
            let isPlaying = true;
            let position = 50;

            // Cambia comparison
            thumbs.forEach((thumb, idx) => {
                thumb.addEventListener('click', () => {
                    currentIndex = idx;
                    thumbs.forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                    comparisons.forEach(c => c.classList.remove('active'));
                    comparisons[idx].classList.add('active');
                    position = 50;
                    updateSlider();
                });
            });

            // Slider con mouse
            wrapper.addEventListener('mousemove', (e) => {
                const rect = wrapper.getBoundingClientRect();
                position = ((e.clientX - rect.left) / rect.width) * 100;
                position = Math.max(0, Math.min(100, position));
                updateSlider();
            });

            // Play/Pause e Reset
            comparisons.forEach(comp => {
                const playBtn = comp.querySelector('.play-btn');
                const resetBtn = comp.querySelector('.reset-btn');

                playBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    isPlaying = !isPlaying;
                    const videos = comp.querySelectorAll('video');
                    const icon = playBtn.querySelector('span:nth-child(1)');
                    const label = playBtn.querySelector('span:nth-child(2)');
                    if (isPlaying) {
                        icon.textContent = '⏸';
                        label.textContent = 'Pause';
                        videos.forEach(v => v.play());
                    } else {
                        icon.textContent = '▶';
                        label.textContent = 'Play';
                        videos.forEach(v => v.pause());
                    }
                });

                resetBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const videos = comp.querySelectorAll('video');
                    videos.forEach(v => {
                        v.pause();
                        v.currentTime = 0;
                        if (isPlaying) v.play();
                    });
                });
            });

            function updateSlider() {
                const activeComp = comparisons[currentIndex];
                const divider = activeComp.querySelector('.divider');
                const beforeContainer = activeComp.querySelector('.image-before');
                divider.style.left = position + '%';
                beforeContainer.style.clipPath = `inset(0 ${100 - position}% 0 0)`;
            }

            updateSlider();
        });
    </script>
</body>

</html>
