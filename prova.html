<!doctype html>
    <html lang="it">

    <head>
        <meta charset="utf-8" />
        <title>Voronoi Sferico</title>

        <!-- Bootstrap 4.5 -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />

        <style>
            body {
                background: #f3f4f6;
                padding: 20px;
            }
        </style>
    </head>

    <body>

        <div class="container-fluid">
            <div class="row align-items-stretch">
                <div class="col-lg-8 mb-3 mb-lg-0">
                    <div class="w-100 text-center">
                        <canvas id="voronoiCanvas" width="600" height="600" style="
              width:100%;
              max-width:600px;
              height:auto;
              aspect-ratio:1 / 1;
              border-radius:16px;
              background:#f8f9fb;
              display:block;
              margin:0 auto;
            "></canvas>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="p-3 border rounded" style="background:#f9fafb;">
                        <h6 class="mb-3">Spherical Voronoi Controls</h6>

                        <div class="form-group">
                            <label for="temperature" class="d-block mb-1" style="font-size:14px;">
                                Temperature:
                            </label>
                            <div class="d-flex align-items-center">
                                <input type="range" id="temperature" min="0" max="500" value="250"
                                    class="custom-range flex-grow-1" />
                                <span id="temperatureLabel" class="ml-2 text-right" style="width:40px; font-size:14px;">
                                    250
                                </span>
                            </div>
                        </div>

                        <div class="form-group mt-3">
                            <label for="numSitesInput" class="d-block mb-1" style="font-size:14px;">
                                Number of sites:
                            </label>
                            <input type="number" id="numSitesInput" min="2" max="64" value="16" class="form-control"
                                style="font-size:14px;" />
                        </div>

                        <button id="generateVoronoi" class="btn btn-light btn-block mt-3" style="
              border-radius:8px;
              border:1px solid #d1d5db;
              font-size:14px;
            ">
                            Generate Voronoi
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

        <script>
            console.log("typeof THREE dopo cdnjs r128 =", typeof THREE);
        </script>

        <script src="https://unpkg.com/three@0.132.2/build/three.min.js"></script>
        <script src="./assets/js/3dvoronoi.js"></script>


        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </body>

    </html>
